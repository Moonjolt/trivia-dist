<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Tripadvisor Games: Travel Trivia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --bg: #f5f5f5;
            --card: #fff;
            --accent: #ff7e00;
            --text: #222;
            --muted: #777;
            --correct: #27ae60;
            --wrong: #e74c3c;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .game {
            background: var(--card);
            width: min(1050px, 100%);
            margin: 20px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }


        /* sticky masthead */
        .masthead {
            position: sticky;
            top: 0;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 20;
        }
        .masthead img {
            height: 32px;
            width: auto;
        }


        /* sticky top bar below masthead */
        .topbar {
            position: sticky;
            top: 53px; /* height of masthead (approx 32 + padding) */
            background: #fff;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 19;
            border-bottom: 1px solid #f0f0f0;
        }
        .title-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .quiz-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            object-fit: cover;
        }
        .title-text {
            display: flex;
            flex-direction: column;
        }
        .title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .subtitle {
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }
        .timer {
            background: #fff5ea;
            padding: 5px 12px;
            border-radius: 6px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
            font-weight: 600;
            color: #c76400;
        }


        .body {
            padding: 0 24px 0 24px;
        }
        .stats {
            display: flex;
            gap: 24px;
            margin: 12px 0 20px 0;
            align-items: center;
            flex-wrap: wrap;
        }
        .statblock {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            color: var(--muted);
        }
        .statnum {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
        }
        .qbox {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 24px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .qtext {
            font-size: 19px;
            font-weight: 600;
        }
        .choices {
            display: grid;
            grid-template-columns: repeat(5, minmax(110px, 1fr));
            gap: 12px;
            margin: 22px 0 24px 0;
        }
        .choice {
            background: #f2f2f2;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
            min-height: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .choice.correct {
            background: #2ecc71 !important;
            border-color: #1b874a !important;
            color: #fff !important;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.65);
        }
        .choice.wrong {
            background: rgba(231, 76, 60, 0.14);
            border-color: #e74c3c;
            color: #7d231a;
        }


        .footer {
            padding: 10px 24px 20px 24px;
            font-size: 12px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .done-screen {
            padding: 40px 24px 50px 24px;
            text-align: center;
        }
        .done-screen h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }
        .score-big {
            font-size: 48px;
            font-weight: 700;
            margin: 20px 0 4px 0;
        }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
        }
        @media (max-width: 769px) {
            .choices {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }
            .topbar {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div class="game">
    <!-- sticky masthead -->
    <div class="masthead">
        <img
                src="https://moonjolt.github.io/connections-dist/assets/logo-uThmMUfH.png"
                alt="userbar"
        />
        <img
                src="https://moonjolt.github.io/connections-dist/assets/userbar-Csa4Nt5X.png"
                alt="logo"
        />
    </div>


    <!-- sticky top title / timer -->
    <div class="topbar">
        <div class="title-section">
            <img
                    src="https://miro.medium.com/v2/resize:fit:708/1*FOVp_7gW8TOSM7djhFGNRQ.png"
                    alt="quiz icon"
                    class="quiz-icon"
            />
            <div class="title-text">
                <div class="title">Quick Pick: Travel Trivia</div>
                <div class="subtitle">
                    Can you answer 10 questions in 60 seconds?
                </div>
            </div>
        </div>
        <div class="timer">⏱ <span id="timer-value">60</span>s</div>
    </div>


    <div class="body" id="game-area"></div>


    <div class="footer">
        <span>Tripadvisor Games</span>
        <span>&copy; 2025</span>
    </div>
</div>


<script>
    const FIXED_ANSWERS = [
        "Dubai",
        "Chile",
        "Cambodia",
        "Jordan",
        "Amalfi",
        "Reykjavik",
        "Lagos",
        "Morocco",
        "Phuket",
        "Istanbul",
    ];


    let QUESTIONS = [
        { clue: "City with the Burj Khalifa", answer: "Dubai" },
        { clue: "Easter Island belongs to which country?", answer: "Chile" },
        { clue: "Angkor Wat is found in", answer: "Cambodia" },
        { clue: "Petra and Wadi Rum are in", answer: "Jordan" },
        { clue: "Positano is on the ____ Coast", answer: "Amalfi" },
        { clue: "Iceland’s capital city", answer: "Reykjavik" },
        { clue: "Nigeria’s largest city", answer: "Lagos" },
        { clue: "Marrakech is in", answer: "Morocco" },
        {
            clue: "Thailand’s island getaway in the Andaman Sea",
            answer: "Phuket",
        },
        { clue: "City split between Europe and Asia", answer: "Istanbul" },
    ];


    function shuffle(arr) {
        return arr
            .map((v) => ({ v, sort: Math.random() }))
            .sort((a, b) => a.sort - b.sort)
            .map(({ v }) => v);
    }
    QUESTIONS = shuffle(QUESTIONS);


    let currentIndex = 0,
        correctCount = 0,
        wrongCount = 0,
        timer = 60,
        timerId = null,
        gameOver = false;


    const permanentlyCorrect = new Set();


    function startTimer() {
        const timerEl = document.getElementById("timer-value");
        timerId = setInterval(() => {
            timer--;
            if (timerEl) timerEl.textContent = timer >= 0 ? timer : 0;
            if (timer <= 0) endGame(true);
        }, 1000);
    }


    function stopTimer() {
        if (timerId) clearInterval(timerId);
    }


    function renderQuestion() {
        if (gameOver) return;
        const container = document.getElementById("game-area");
        const q = QUESTIONS[currentIndex];


        container.innerHTML = `
       <div class="stats">
         <div class="statblock"><span>QUESTIONS LEFT</span><span class="statnum">${
            QUESTIONS.length - currentIndex
        }</span></div>
         <div class="statblock"><span>CORRECT</span><span class="statnum" id="correct-count">${correctCount}</span></div>
         <div class="statblock"><span>WRONG</span><span class="statnum" id="wrong-count">${wrongCount}</span></div>
         <div class="statblock"><span>SCORE</span><span class="statnum">${correctCount}/${
            QUESTIONS.length
        }</span></div>
       </div>
       <div class="qbox"><div class="qtext">${q.clue}</div></div>
       <div class="choices" id="choices"></div>
     `;


        const choicesEl = document.getElementById("choices");
        FIXED_ANSWERS.forEach((label) => {
            const div = document.createElement("div");
            div.className = "choice";
            div.textContent = label;
            if (permanentlyCorrect.has(label)) div.classList.add("correct");
            div.addEventListener("click", () =>
                handleChoice(div, label, q.answer)
            );
            choicesEl.appendChild(div);
        });
    }


    function handleChoice(el, chosen, correct) {
        if (gameOver) return;
        const allChoices = Array.from(document.querySelectorAll(".choice"));
        allChoices.forEach((c) => (c.style.pointerEvents = "none"));


        if (chosen === correct) {
            el.classList.add("correct");
            permanentlyCorrect.add(chosen);
            correctCount++;
            document.getElementById("correct-count").textContent = correctCount;
            setTimeout(() => nextQuestion(), 450);
        } else {
            el.classList.add("wrong");
            allChoices.forEach((c) => {
                if (c.textContent === correct) {
                    c.classList.add("correct");
                    permanentlyCorrect.add(correct);
                }
            });
            wrongCount++;
            document.getElementById("wrong-count").textContent = wrongCount;
            setTimeout(() => nextQuestion(), 700);
        }
    }


    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= QUESTIONS.length) {
            endGame(false);
        } else {
            renderQuestion();
        }
    }


    function endGame(fromTimer) {
        if (gameOver) return;
        gameOver = true;
        stopTimer();
        const container = document.getElementById("game-area");
        container.innerHTML = `
       <div class="done-screen">
         <h2>${fromTimer ? "Time's Up! ⏰" : "All Done ✅"}</h2>
         <div class="score-big">${correctCount}/${QUESTIONS.length}</div>
         <button class="btn" id="restart-btn">Play again</button>
       </div>
     `;
        document.getElementById("restart-btn").addEventListener("click", () => {
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            timer = 60;
            gameOver = false;
            permanentlyCorrect.clear();
            QUESTIONS = shuffle(QUESTIONS);
            startTimer();
            renderQuestion();
        });
    }


    window.addEventListener("DOMContentLoaded", () => {
        startTimer();
        renderQuestion();
    });
</script>
</body>
</html>
